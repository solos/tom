[package]
name = "plugin-stub"
version = "0.1.11"
edition = "2021"
publish = false
description = "Minimal tom Rust-cdylib plugin: registers an `echo` tool + one event handler (the Part B2 ABI smoke target)."

[lib]
# cdylib so the host can load it via libloading as tom_plugin_register_v2.
crate-type = ["cdylib"]

[dependencies]
tom-plugin-sdk = { workspace = true }
serde_json = { workspace = true }
