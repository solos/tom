# Contributors do not bump versions. Release-plz prepares one workspace PR;
# release.yml publishes it only after a maintainer merges that PR into main.
[workspace]
release = false
release_always = false
dependencies_update = false
changelog_update = false
git_tag_enable = false
git_release_enable = false
pr_branch_prefix = "release-plz-"
pr_name = "chore(release): prepare {{ version }}"
pr_draft = true

[[package]]
name = "tom-telemetry"
release = true
version_group = "tom"

[[package]]
name = "tom-ai"
release = true
version_group = "tom"

[[package]]
name = "tom-runtime"
release = true
version_group = "tom"

[[package]]
name = "tom-agent"
release = true
version_group = "tom"

[[package]]
name = "tom-plugin-sdk"
release = true
version_group = "tom"

[[package]]
name = "tom-extensions"
release = true
version_group = "tom"

[[package]]
name = "tom-tools"
release = true
version_group = "tom"

[[package]]
name = "tom-mcp"
release = true
version_group = "tom"

[[package]]
name = "tom-harness"
release = true
version_group = "tom"

[[package]]
name = "tom-tui"
release = true
version_group = "tom"

[[package]]
name = "tom-cli"
release = true
version_group = "tom"
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = ["tom-telemetry", "tom-ai", "tom-runtime", "tom-agent", "tom-plugin-sdk", "tom-extensions", "tom-tools", "tom-mcp", "tom-harness", "tom-tui"]
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
