# tom — a Rust agent runtime + CLI. See README.md and docs/architecture/overview.md.
[workspace]
members = [
    "crates/tom-telemetry",
    "crates/tom-ai",
    "crates/tom-agent",
    "crates/tom-tools",
    "crates/tom-harness",
    "crates/tom-cli",
    "crates/tom-runtime",
    "crates/tom-tui",
    "crates/tom-plugin-sdk",
    "crates/tom-extensions",
    "examples/minimal",
    "examples/tools",
    "examples/tui",
    "examples/plugin-stub",
]
default-members = [
    "crates/tom-agent",
    "crates/tom-tools",
    "crates/tom-harness",
    "crates/tom-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/bigfish1913/tom"
homepage = "https://tom.laofu.online/"
version = "0.16.0"
authors = ["BigFish <fuwei201473@gmail.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"
fs2 = "0.4"

# Serialization / schemas
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
yaml_serde = "=0.10.2"
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "0.8", features = ["preserve_order"] }
jsonschema = "0.18"

# HTTP / SSE (used by anthropic provider, M3)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
bytes = "1"
eventsource-stream = "0.2"

# Errors / logging
thiserror = "1"
tracing = "0.1"

# Misc
uuid = { version = "1", features = ["v4", "v7"] }
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
png = "0.18"
ciborium = "0.2"
tempfile = "3"
regex = "1"
semver = "1"
globset = "=0.4.15"
dirs = "5"
rpassword = "7"

# tom internal crates (package names and directories both use the `tom-` prefix).
tom-telemetry = { path = "crates/tom-telemetry", version = "0.16.0" }
tom-ai = { path = "crates/tom-ai", version = "0.16.0" }
tom-agent = { path = "crates/tom-agent", version = "0.16.0" }
tom-tools = { path = "crates/tom-tools", version = "0.16.0" }
tom-harness = { path = "crates/tom-harness", version = "0.16.0" }

tom-runtime = { path = "crates/tom-runtime", version = "0.16.0" }

tom-tui = { path = "crates/tom-tui", version = "0.16.0" }

tom-plugin-sdk = { path = "crates/tom-plugin-sdk", version = "0.16.0" }
tom-extensions = { path = "crates/tom-extensions", version = "0.16.0" }

[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"
